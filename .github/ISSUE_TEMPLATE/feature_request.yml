name: Feature request
description: Suggest an improvement to Win Stats
title: ""
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the need or problem you have.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like Win Stats to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any alternatives that might also solve the problem.
