name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/StatsBar/StatsBar.csproj
      - name: Build
        run: dotnet build src/StatsBar/StatsBar.csproj --configuration Release --no-restore
      - name: Package portable ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -SkipInstaller
      - uses: actions/upload-artifact@v7
        with:
          name: WinStats-portable-x64
          path: artifacts/release/*
          if-no-files-found: error
