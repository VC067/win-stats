name: Draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version, with an optional prerelease
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installerPath
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'Inno Setup download checksum did not match the pinned official release.'
          }
          $installerArguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR="{0}"' -f $compilerDirectory
          $installation = Start-Process -FilePath $installerPath -ArgumentList $installerArguments -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($installation.ExitCode)."
          }
          $compilerPath = Join-Path $compilerDirectory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw 'Inno Setup compiler was not installed.'
          }
          "ISCC_PATH=$compilerPath" >> $env:GITHUB_ENV
      - name: Validate version and license
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:RELEASE_VERSION
          } else {
            $version = $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Release version '$version' is invalid."
          }
          if (-not (Test-Path -LiteralPath 'LICENSE' -PathType Leaf)) {
            throw 'LICENSE is required before a release can be uploaded.'
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $releaseTag = "v$version"
          } else {
            $releaseTag = $env:REF_NAME
          }
          $headOutput = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($headOutput -join ''))) {
            throw 'Could not resolve the checked-out commit.'
          }
          $headSha = ($headOutput -join '').Trim()
          $tagCommitRef = "refs/tags/$releaseTag^{commit}"
          $tagOutput = & git rev-parse --verify $tagCommitRef 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($tagOutput -join ''))) {
            throw "Release tag '$releaseTag' does not exist in the checked-out source."
          }
          $tagSha = ($tagOutput -join '').Trim()
          if ($tagSha -ne $headSha) {
            throw "Release tag '$releaseTag' resolves to $tagSha, but checked-out HEAD is $headSha."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "TARGET_COMMITISH=$headSha" >> $env:GITHUB_ENV
      - name: Package release
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION -IsccPath $env:ISCC_PATH
      - name: Save release packages
        uses: actions/upload-artifact@v7
        with:
          name: WinStats-${{ env.RELEASE_VERSION }}-x64
          path: artifacts/release/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Win Stats ${{ env.RELEASE_VERSION }}
          draft: true
          files: artifacts/release/*
          fail_on_unmatched_files: true
