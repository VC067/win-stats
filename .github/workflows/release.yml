name: Draft release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version, with an optional prerelease
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.3 --no-progress --yes
      - name: Validate version and license
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:RELEASE_VERSION
          } else {
            $version = $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Release version '$version' is invalid."
          }
          if (-not (Test-Path -LiteralPath 'LICENSE' -PathType Leaf)) {
            throw 'LICENSE is required before a release can be uploaded.'
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $releaseTag = "v$version"
          } else {
            $releaseTag = $env:REF_NAME
          }
          $headOutput = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($headOutput -join ''))) {
            throw 'Could not resolve the checked-out commit.'
          }
          $headSha = ($headOutput -join '').Trim()
          $tagCommitRef = "refs/tags/$releaseTag^{commit}"
          $tagOutput = & git rev-parse --verify $tagCommitRef 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($tagOutput -join ''))) {
            throw "Release tag '$releaseTag' does not exist in the checked-out source."
          }
          $tagSha = ($tagOutput -join '').Trim()
          if ($tagSha -ne $headSha) {
            throw "Release tag '$releaseTag' resolves to $tagSha, but checked-out HEAD is $headSha."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "TARGET_COMMITISH=$headSha" >> $env:GITHUB_ENV
      - name: Package release
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_COMMITISH }}
          name: Win Stats ${{ env.RELEASE_VERSION }}
          draft: true
          files: artifacts/release/*
          fail_on_unmatched_files: true
